services:
  - type: web
    name: clonar-dc-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clonar-dc-db
          property: connectionString
      - key: GUILDSYNC_ENV
        value: staging
      - key: GUILDSYNC_ADMIN_EMAIL
        sync: false
      - key: GUILDSYNC_ADMIN_PASSWORD
        sync: false
      - key: GUILDSYNC_BOT_API_KEY
        sync: false
      - key: GUILDSYNC_SESSION_HOURS
        value: "12"
      - key: GUILDSYNC_ALLOW_FILE_STORAGE
        value: "false"
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_USE_SANDBOX
        value: "true"
      - key: MERCADOPAGO_ALLOW_UNSIGNED_WEBHOOKS
        value: "false"
      - key: GUILDSYNC_PAYMENT_CURRENCY
        value: BRL
      - key: GUILDSYNC_PRICE_1M
        value: "1.00"
      - key: GUILDSYNC_PRICE_3M
        value: "0"
      - key: GUILDSYNC_PRICE_6M
        value: "0"
      - key: GUILDSYNC_PRICE_12M
        value: "0"
      - key: GUILDSYNC_PRICE_PERMANENT
        value: "0"

databases:
  - name: clonar-dc-db
    plan: free
    region: virginia
    databaseName: clonardc
    user: clonardc
    postgresMajorVersion: "18"
    ipAllowList: []
