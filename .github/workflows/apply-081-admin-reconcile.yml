name: Apply GuildSync 0.8.1 Hotfix Patches

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: guildsync-081-hotfix-patches-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply administrator reconciliation
        shell: pwsh
        run: ./scripts/Apply-081-AdminReconcile.ps1

      - name: Align GuildSync 0.8.1 versions
        shell: pwsh
        run: ./scripts/Apply-081-VersionPatch.ps1

      - name: Commit generated hotfix source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) {
            Write-Host 'All 0.8.1 hotfix patches are already integrated.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src installer scripts README.md .github/workflows/final-release.yml .github/workflows/pull-request-quality.yml
          git commit -m 'release: align GuildSync 0.8.1 brand and admin hotfix [skip ci]'
          git pull --rebase origin ${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}
