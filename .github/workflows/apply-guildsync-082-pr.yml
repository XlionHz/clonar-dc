name: Run GuildSync 0.8.2 patch

on:
  pull_request:
    branches: [ main ]
    paths: [ .github/workflows/apply-guildsync-082-pr.yml ]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute the prepared patch
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          @'
          import subprocess
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/apply-guildsync-082.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['apply']['steps']
          scripts = [step['run'] for step in steps if isinstance(step, dict) and 'run' in step]
          if len(scripts) != 2:
              raise SystemExit(f'Expected 2 prepared PowerShell scripts, found {len(scripts)}.')

          for index, script in enumerate(scripts, start=1):
              path = Path(f'apply-082-{index}.ps1')
              path.write_text(script, encoding='utf-8')
              subprocess.run(['pwsh', '-NoProfile', '-File', str(path)], check=True)
              path.unlink(missing_ok=True)
          '@ | Set-Content run_prepared_patch.py -Encoding UTF8
          python run_prepared_patch.py
          Remove-Item run_prepared_patch.py -ErrorAction SilentlyContinue
