name: GuildSync Pull Request Quality

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guildsync-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify preinstalled .NET 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --info
          $major = [int]((dotnet --version).Split('.')[0])
          if ($major -lt 10) { throw 'The runner does not provide .NET 10 or newer.' }

      - name: Prepare diagnostics
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path out/diagnostics,out/desktop-test | Out-Null

      - name: Verify source contracts and secrets
        shell: pwsh
        run: ./scripts/Test-SourceContracts.ps1

      - name: Restore projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore ./src/ClonarDC.Desktop/ClonarDC.Desktop.csproj *>&1 | Tee-Object out/diagnostics/restore-desktop.log
          dotnet restore ./src/ClonarDC.Server/ClonarDC.Server.csproj *>&1 | Tee-Object out/diagnostics/restore-api.log
          dotnet restore ./src/GuildSync.Bot/GuildSync.Bot.csproj *>&1 | Tee-Object out/diagnostics/restore-bot.log

      - name: Build projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            dotnet build ./src/ClonarDC.Desktop/ClonarDC.Desktop.csproj -c Release --no-restore *>&1 | Tee-Object out/diagnostics/build-desktop.log
            if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed.' }

            dotnet build ./src/ClonarDC.Server/ClonarDC.Server.csproj -c Release --no-restore *>&1 | Tee-Object out/diagnostics/build-api.log
            if ($LASTEXITCODE -ne 0) { throw 'API build failed.' }

            dotnet build ./src/GuildSync.Bot/GuildSync.Bot.csproj -c Release --no-restore *>&1 | Tee-Object out/diagnostics/build-bot.log
            if ($LASTEXITCODE -ne 0) { throw 'Bot build failed.' }

            dotnet publish ./src/ClonarDC.Desktop/ClonarDC.Desktop.csproj -c Release --no-restore --self-contained false -p:DebugType=None -p:DebugSymbols=false -o out/desktop-test *>&1 | Tee-Object out/diagnostics/publish-desktop-test.log
            if ($LASTEXITCODE -ne 0) { throw 'Desktop test publish failed.' }

            $assembly = Get-ChildItem out/desktop-test -Filter 'ClonarDC.dll' -File | Select-Object -First 1
            if ($null -eq $assembly) {
              Get-ChildItem out/desktop-test | Format-Table Name,Length | Out-String | Tee-Object out/diagnostics/desktop-test-files.log
              throw 'Deterministic desktop assembly was not generated.'
            }
            $assembly.FullName | Set-Content out/desktop-assembly-path.txt
          }
          catch {
            $_ | Format-List * -Force | Out-String | Tee-Object out/diagnostics/build-exception.log
            throw
          }

      - name: Test engine reliability contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $desktopAssembly = (Get-Content out/desktop-assembly-path.txt -Raw).Trim()
            ./scripts/Test-EngineReliability.ps1 -DesktopAssembly $desktopAssembly *>&1 |
              Tee-Object -FilePath out/diagnostics/engine-reliability.log
          }
          catch {
            $_ | Format-List * -Force | Out-String | Tee-Object -FilePath out/diagnostics/engine-reliability.log -Append
            throw
          }

      - name: Publish API for smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish ./src/ClonarDC.Server/ClonarDC.Server.csproj -c Release --no-restore -p:DebugType=None -p:DebugSymbols=false -o out/backend
          if (-not (Test-Path out/backend/ClonarDC.Server.dll)) { throw 'GuildSync API assembly was not generated.' }

      - name: Run API behavior smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./scripts/Test-GuildSyncApi.ps1 -BackendPath "$PWD/out/backend/ClonarDC.Server.dll" -ExpectedVersion '0.8.2' *>&1 |
              Tee-Object -FilePath out/diagnostics/api-smoke.log
          }
          catch {
            $_ | Format-List * -Force | Out-String | Tee-Object -FilePath out/diagnostics/api-smoke.log -Append
            throw
          }

      - name: Test configured administrator reconciliation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./scripts/Test-AdminReconciliation.ps1 -BackendPath "$PWD/out/backend/ClonarDC.Server.dll" -ExpectedVersion '0.8.2' *>&1 |
              Tee-Object -FilePath out/diagnostics/admin-reconciliation.log
          }
          catch {
            $_ | Format-List * -Force | Out-String | Tee-Object -FilePath out/diagnostics/admin-reconciliation.log -Append
            throw
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guildsync-pr-diagnostics
          path: |
            out/desktop-test/*.deps.json
            out/desktop-test/*.runtimeconfig.json
            out/backend/*.deps.json
            out/backend/*.runtimeconfig.json
            out/diagnostics/**
          if-no-files-found: ignore
          retention-days: 7
