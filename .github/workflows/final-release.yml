name: Clonar DC Verified Windows Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'build-status/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clonar-dc-build
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      APP_VERSION: '0.6.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build-status,out | Out-Null
          dotnet restore .\src\ClonarDC.Desktop\ClonarDC.Desktop.csproj
          dotnet build .\src\ClonarDC.Desktop\ClonarDC.Desktop.csproj -c Release --no-restore
          dotnet restore .\src\ClonarDC.Server\ClonarDC.Server.csproj
          dotnet build .\src\ClonarDC.Server\ClonarDC.Server.csproj -c Release --no-restore

      - name: Verify product contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xaml = Get-Content .\src\ClonarDC.Desktop\MainWindow.xaml -Raw
          $paymentUi = Get-Content .\src\ClonarDC.Desktop\MainWindow.Payments.cs -Raw
          $auth = Get-Content .\src\ClonarDC.Desktop\Services\AuthClient.cs -Raw
          $resolver = Get-Content .\src\ClonarDC.Desktop\Services\ApiEndpointResolver.cs -Raw
          $backendPayments = Get-Content .\src\ClonarDC.Server\MercadoPagoPayments.cs -Raw
          $render = Get-Content .\render.yaml -Raw
          $apiUrl = (Get-Content .\src\ClonarDC.Desktop\api-url.txt -Raw).Trim()

          foreach ($required in @('AcceptTokenWithoutValidation_Click','LoadServers_Click','Use locally','Load servers','Buy with Mercado Pago','Refresh license')) {
            if (-not $xaml.Contains($required)) { throw "Desktop contract is missing: $required" }
          }
          foreach ($required in @('CreateCheckoutAsync','GetPaymentOrderAsync','GetCurrentSessionAsync','payments/checkout','payments/orders')) {
            if (-not $auth.Contains($required)) { throw "Payment client contract is missing: $required" }
          }
          foreach ($required in @('PollPaymentAsync','Payment approved','ProcessStartInfo','RefreshLicenseFromServerAsync')) {
            if (-not $paymentUi.Contains($required)) { throw "Payment UI contract is missing: $required" }
          }
          foreach ($required in @('/payments/checkout','/webhooks/mercadopago','ApplyMercadoPagoPaymentAsync','license-activated','amount-or-currency-mismatch')) {
            if (-not $backendPayments.Contains($required)) { throw "Backend payment contract is missing: $required" }
          }
          foreach ($required in @('CLONARDC_API','api-url.txt','RegistryValue = "ApiUrl"','https')) {
            if (-not $resolver.Contains($required)) { throw "API resolver contract is missing: $required" }
          }
          if ($apiUrl -ne 'https://clonar-dc-api.onrender.com') { throw 'Bundled central API URL is incorrect.' }
          foreach ($required in @('runtime: docker','healthCheckPath: /status','MERCADOPAGO_WEBHOOK_SECRET','CLONARDC_PRICE_1M','value: "1.00"')) {
            if (-not $render.Contains($required)) { throw "Render contract is missing: $required" }
          }

          'Payment UI, central API address, checkout polling, backend webhook and deployment settings verified.' | Set-Content out/payment-desktop-contract.txt

      - name: Publish desktop and backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fullVersion = "$env:APP_VERSION.$env:GITHUB_RUN_NUMBER"
          New-Item -ItemType Directory -Force -Path out/app,out/backend | Out-Null
          dotnet publish .\src\ClonarDC.Desktop\ClonarDC.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:APP_VERSION -p:FileVersion=$fullVersion -p:AssemblyVersion=$fullVersion -o out/app
          dotnet publish .\src\ClonarDC.Server\ClonarDC.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o out/backend
          if (-not (Test-Path out/app/ClonarDC.exe)) { throw 'ClonarDC.exe was not generated.' }
          if (-not (Test-Path out/app/api-url.txt)) { throw 'api-url.txt was not published.' }
          if (-not (Test-Path out/backend/ClonarDC.Server.exe)) { throw 'ClonarDC.Server.exe was not generated.' }

      - name: Local backend smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testData = Join-Path $env:RUNNER_TEMP 'clonardc-auth-smoke'
          Remove-Item $testData -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $testData | Out-Null
          $env:CLONARDC_LISTEN = 'http://127.0.0.1:18787'
          $env:CLONARDC_DATA = $testData
          $env:CLONARDC_ADMIN_EMAIL = 'build-admin@example.invalid'
          $env:CLONARDC_ADMIN_PASSWORD = 'BuildOnly!Admin_2026'
          $backend = Start-Process -FilePath "$PWD\out\backend\ClonarDC.Server.exe" -PassThru -WindowStyle Hidden
          try {
            $status = $null
            for ($i = 0; $i -lt 60; $i++) {
              try { $status = Invoke-RestMethod -Uri 'http://127.0.0.1:18787/status' -TimeoutSec 1; break }
              catch { Start-Sleep -Milliseconds 250 }
            }
            if ($null -eq $status) { throw 'Backend did not start.' }
            $email = "user-$([Guid]::NewGuid().ToString('N'))@example.invalid"
            $password = 'BuildOnly!User_2026'
            $register = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18787/auth/register' -ContentType 'application/json' -Body (@{name='Build User';email=$email;password=$password}|ConvertTo-Json)
            if ($register.status -ne 'pending') { throw 'Registration failed.' }
            $login = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18787/auth/login' -ContentType 'application/json' -Body (@{email=$email;password=$password}|ConvertTo-Json)
            if (-not $login.accessToken) { throw 'Login failed.' }
            'Backend registration and login passed.' | Set-Content out/auth-smoke.txt
          }
          finally {
            if ($backend -and -not $backend.HasExited) { Stop-Process -Id $backend.Id -Force }
            Remove-Item Env:CLONARDC_LISTEN,Env:CLONARDC_DATA,Env:CLONARDC_ADMIN_EMAIL,Env:CLONARDC_ADMIN_PASSWORD -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and update package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc 'installer\ClonarDC.iss'
          $setup = 'out\installer\Clonar-DC-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'Installer was not generated.' }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          $hash | Set-Content 'out\installer\Clonar-DC-Setup.sha256'
          "VERSION=$env:APP_VERSION`nSHA256=$hash" | Set-Content 'out\installer\build-info.txt'

          $packageRoot = 'out\update-package'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item $setup (Join-Path $packageRoot 'Clonar-DC-Setup.exe')
          [ordered]@{
            formatVersion = 1
            version = $env:APP_VERSION
            tag = "v$env:APP_VERSION"
            title = "Clonar DC $env:APP_VERSION"
            notes = 'Connects to the central HTTPS API and adds in-app Mercado Pago license purchase with automatic confirmation.'
            setupFile = 'Clonar-DC-Setup.exe'
            sha256 = $hash
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $packageRoot 'manifest.json') -Encoding UTF8
          $zip = "out\Clonar-DC-$env:APP_VERSION-update.zip"
          $package = "out\Clonar-DC-$env:APP_VERSION.clonardc-update"
          Compress-Archive -Path "$packageRoot\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Move-Item $zip $package -Force

      - name: Installer smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "$PWD\out\installer\Clonar-DC-Setup.exe"
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/LANG=en' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer returned $($install.ExitCode)." }
          $root = Join-Path $env:LOCALAPPDATA 'Programs\Clonar DC'
          if (-not (Test-Path (Join-Path $root 'ClonarDC.exe'))) { throw 'Installed app was not found.' }
          if ((Get-Content (Join-Path $root 'api-url.txt') -Raw).Trim() -ne 'https://clonar-dc-api.onrender.com') { throw 'Installed central API URL is incorrect.' }
          'Installer and central API configuration passed.' | Set-Content out/installer-smoke.txt

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Clonar-DC-Verified-Windows
          path: |
            out/installer/Clonar-DC-Setup.exe
            out/installer/Clonar-DC-Setup.sha256
            out/installer/build-info.txt
            out/Clonar-DC-${{ env.APP_VERSION }}.clonardc-update
            out/payment-desktop-contract.txt
            out/auth-smoke.txt
            out/installer-smoke.txt
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION-alpha.$env:GITHUB_RUN_NUMBER"
          gh release create $tag 'out/installer/Clonar-DC-Setup.exe' 'out/installer/Clonar-DC-Setup.sha256' "out/Clonar-DC-$env:APP_VERSION.clonardc-update" --title "Clonar DC $env:APP_VERSION Alpha $env:GITHUB_RUN_NUMBER" --notes 'Central API is bundled by default. License purchases can be started inside the app and are confirmed automatically through Mercado Pago webhooks.' --target $env:GITHUB_SHA

      - name: Record successful build
        if: success()
        shell: pwsh
        run: |
          $hash = (Get-Content 'out\installer\Clonar-DC-Setup.sha256' -Raw).Trim()
          @"
          # Latest verified build

          Status: **SUCCESS**
          Version: `$env:APP_VERSION`
          Source commit: `${{ github.sha }}`
          Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Release: https://github.com/${{ github.repository }}/releases/tag/v$env:APP_VERSION-alpha.${{ github.run_number }}
          SHA-256: `$hash`

          Validation: desktop/backend compiled; payment UI and central API contracts checked; registration/login tested; installer and update package verified.
          "@ | Set-Content build-status/latest.md -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status
          git commit -m 'ci: record verified Windows build [skip ci]'
          git push

      - name: Record failed build
        if: failure()
        shell: pwsh
        run: |
          @"
          # Latest verified build

          Status: **FAILURE**
          Version: `$env:APP_VERSION`
          Source commit: `${{ github.sha }}`
          Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "@ | Set-Content build-status/latest.md -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status
          git commit -m 'ci: record failed Windows build diagnostics [skip ci]' || exit 0
          git push || exit 0