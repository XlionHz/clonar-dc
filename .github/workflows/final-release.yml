name: GuildSync Verified Windows Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'build-status/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guildsync-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      APP_VERSION: '0.8.2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify preinstalled .NET 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --info
          $major = [int]((dotnet --version).Split('.')[0])
          if ($major -lt 10) { throw 'The runner does not provide .NET 10 or newer.' }

      - name: Verify source contracts and secrets
        shell: pwsh
        run: ./scripts/Test-SourceContracts.ps1

      - name: Restore and build all GuildSync components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore ./src/ClonarDC.Desktop/ClonarDC.Desktop.csproj
          dotnet restore ./src/ClonarDC.Server/ClonarDC.Server.csproj
          dotnet restore ./src/GuildSync.Bot/GuildSync.Bot.csproj
          dotnet build ./src/ClonarDC.Desktop/ClonarDC.Desktop.csproj -c Release --no-restore
          dotnet build ./src/ClonarDC.Server/ClonarDC.Server.csproj -c Release --no-restore
          dotnet build ./src/GuildSync.Bot/GuildSync.Bot.csproj -c Release --no-restore

      - name: Test engine reliability contracts
        shell: pwsh
        run: ./scripts/Test-EngineReliability.ps1

      - name: Publish desktop, API and bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fullVersion = "$env:APP_VERSION.$env:GITHUB_RUN_NUMBER"
          New-Item -ItemType Directory -Force -Path out/app,out/backend,out/bot,out/installer | Out-Null
          dotnet publish ./src/ClonarDC.Desktop/ClonarDC.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:APP_VERSION -p:FileVersion=$fullVersion -p:AssemblyVersion=0.8.2.0 -o out/app
          dotnet publish ./src/ClonarDC.Server/ClonarDC.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:APP_VERSION -p:FileVersion=$fullVersion -p:AssemblyVersion=0.8.2.0 -o out/backend
          dotnet publish ./src/GuildSync.Bot/GuildSync.Bot.csproj -c Release -r linux-x64 --self-contained false -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:APP_VERSION -p:AssemblyVersion=0.8.2.0 -o out/bot
          if (-not (Test-Path out/app/ClonarDC.exe)) { throw 'GuildSync desktop executable was not generated.' }
          if (-not (Test-Path out/app/api-url.txt)) { throw 'api-url.txt was not published.' }
          if (-not (Test-Path out/backend/ClonarDC.Server.exe)) { throw 'GuildSync API executable was not generated.' }
          if (-not (Test-Path out/bot/GuildSync.Bot.dll)) { throw 'GuildSync bot was not generated.' }

      - name: Run API and device behavior smoke test
        shell: pwsh
        run: ./scripts/Test-GuildSyncApi.ps1 -BackendPath "$PWD/out/backend/ClonarDC.Server.exe" -ExpectedVersion $env:APP_VERSION

      - name: Desktop runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process -FilePath "$PWD/out/app/ClonarDC.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "GuildSync exited early with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
          'GuildSync desktop stayed alive for 10 seconds.' | Set-Content out/desktop-smoke.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and verified update package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe was not found.' }
          & $iscc 'installer\ClonarDC.iss'
          $setup = 'out\installer\GuildSync-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'GuildSync installer was not generated.' }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          $hash | Set-Content 'out\installer\GuildSync-Setup.sha256'
          "VERSION=$env:APP_VERSION`nSHA256=$hash`nCOMMIT=$env:GITHUB_SHA" | Set-Content 'out\installer\build-info.txt'

          $packageRoot = 'out\update-package'
          Remove-Item $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item $setup (Join-Path $packageRoot 'GuildSync-Setup.exe')
          [ordered]@{
            formatVersion = 1
            version = $env:APP_VERSION
            tag = "v$env:APP_VERSION"
            title = "GuildSync $env:APP_VERSION"
            notes = 'Premium animated login, unified GuildSync branding, unrestricted local Token input and editable source/destination server IDs.'
            setupFile = 'GuildSync-Setup.exe'
            sha256 = $hash
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $packageRoot 'manifest.json') -Encoding UTF8
          $zip = "out\GuildSync-$env:APP_VERSION-update.zip"
          $package = "out\GuildSync-$env:APP_VERSION.clonardc-update"
          Compress-Archive -Path "$packageRoot\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Move-Item $zip $package -Force
          Copy-Item $package 'out\verify-update-package.zip' -Force
          Expand-Archive 'out\verify-update-package.zip' 'out\verify-update-package' -Force
          $manifest = Get-Content 'out\verify-update-package\manifest.json' -Raw | ConvertFrom-Json
          $actual = (Get-FileHash 'out\verify-update-package\GuildSync-Setup.exe' -Algorithm SHA256).Hash
          if ($manifest.version -ne $env:APP_VERSION -or $actual -ne $manifest.sha256) { throw 'GuildSync update package verification failed.' }

      - name: Installer smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "$PWD/out/installer/GuildSync-Setup.exe"
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/LANG=en' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer returned $($install.ExitCode)." }
          $root = Join-Path $env:LOCALAPPDATA 'Programs\GuildSync'
          if (-not (Test-Path (Join-Path $root 'ClonarDC.exe'))) { throw 'Installed GuildSync app was not found.' }
          if (-not (Test-Path (Join-Path $root 'backend\ClonarDC.Server.exe'))) { throw 'Installed GuildSync API was not found.' }
          if ((Get-Content (Join-Path $root 'api-url.txt') -Raw).Trim() -ne 'https://clonar-dc-api.onrender.com') { throw 'Installed central API URL is incorrect.' }
          $installedVersion = (Get-Item (Join-Path $root 'ClonarDC.exe')).VersionInfo.ProductVersion
          if (-not $installedVersion.StartsWith($env:APP_VERSION)) { throw "Installed desktop version is unexpected: $installedVersion" }
          'GuildSync 0.8.2 installer passed.' | Set-Content out/installer-smoke.txt

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GuildSync-Verified-Windows-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: |
            out/installer/GuildSync-Setup.exe
            out/installer/GuildSync-Setup.sha256
            out/installer/build-info.txt
            out/GuildSync-${{ env.APP_VERSION }}.clonardc-update
            out/bot/**
            out/desktop-smoke.txt
            out/installer-smoke.txt
            render.yaml
            Dockerfile
            Dockerfile.bot
            docs/**
          if-no-files-found: error

      - name: Create or update prerelease
        id: publish_release
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:APP_VERSION-alpha.$env:GITHUB_RUN_NUMBER"
          $title = "GuildSync $env:APP_VERSION Alpha $env:GITHUB_RUN_NUMBER"
          $notes = 'Premium animated login, unified branding, unrestricted local Token input and editable server IDs.'
          $assets = @(
            'out/installer/GuildSync-Setup.exe',
            'out/installer/GuildSync-Setup.sha256',
            "out/GuildSync-$env:APP_VERSION.clonardc-update"
          )

          & gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            & gh release create $tag --title $title --notes $notes --target $env:GITHUB_SHA --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not create prerelease $tag." }
          }
          else {
            & gh release edit $tag --title $title --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not update prerelease $tag." }
          }

          & gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload assets to prerelease $tag." }

      - name: Report release publication warning
        if: steps.publish_release.outcome == 'failure'
        shell: pwsh
        run: Write-Warning 'Verified artifacts were uploaded to GitHub Actions, but GitHub Releases publication failed.'

      - name: Record successful build
        if: success()
        shell: pwsh
        run: |
          $hash = (Get-Content 'out\installer\GuildSync-Setup.sha256' -Raw).Trim()
          @(
            '# Latest verified build',
            '',
            'Status: **SUCCESS**',
            "Version: $env:APP_VERSION",
            "Source commit: $env:GITHUB_SHA",
            "Workflow run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Release publication: ${{ steps.publish_release.outcome }}",
            "SHA-256: $hash",
            '',
            'Validation: desktop, API and bot compiled; branding contracts, administrator reconciliation, API behavior, runtime, installer and update package verified.'
          ) | Set-Content build-status/latest.md -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status/latest.md
          git commit -m 'ci: record verified GuildSync build [skip ci]'
          git pull --rebase origin main
          git push

      - name: Record failed build
        if: failure()
        shell: pwsh
        run: |
          @(
            '# Latest verified build',
            '',
            'Status: **FAILURE**',
            "Version: $env:APP_VERSION",
            "Source commit: $env:GITHUB_SHA",
            "Workflow run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content build-status/latest.md -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status/latest.md
          git commit -m 'ci: record failed GuildSync build [skip ci]' || exit 0
          git pull --rebase origin main || exit 0
          git push || exit 0
