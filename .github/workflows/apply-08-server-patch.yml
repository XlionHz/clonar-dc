name: Apply GuildSync 0.8 Server Integration

on:
  push:
    branches: [ agent/guildsync-0.8-engine-reliability ]
    paths:
      - 'scripts/Apply-08-ServerPatch.ps1'
      - '.github/workflows/apply-08-server-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, 'server: integrate device enforcement') }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/guildsync-0.8-engine-reliability
          fetch-depth: 0

      - name: Apply server patch
        shell: pwsh
        run: ./scripts/Apply-08-ServerPatch.ps1

      - name: Commit generated integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) {
            Write-Host 'Server integration is already applied.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ClonarDC.Server/Program.cs
          git commit -m 'server: integrate device enforcement [skip ci]'
          git push origin HEAD:agent/guildsync-0.8-engine-reliability