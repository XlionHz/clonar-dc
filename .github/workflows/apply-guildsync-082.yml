name: Apply GuildSync 0.8.2 patch

on:
  pull_request:
    branches: [ main ]
    paths: [ .github/workflows/apply-guildsync-082.yml ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic 0.8.2 finalizer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check pillow
          python .github/scripts/finalize_082.py
          git checkout -- .github/workflows
          git config user.name 'GuildSync Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ([string]::IsNullOrWhiteSpace((git status --porcelain))) {
            throw 'GuildSync 0.8.2 finalizer produced no changes.'
          }
          git commit -m 'release: complete GuildSync 0.8.2 login, branding and input fixes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
